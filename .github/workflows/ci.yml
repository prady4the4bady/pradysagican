name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest -q tests

      - name: Verify enterprise API startup
        run: |
          python -m uvicorn pradysagican.api.enterprise_server:create_api_server --factory --host 127.0.0.1 --port 8001 &
          sleep 3
          curl -f http://127.0.0.1:8001/live
          curl -f http://127.0.0.1:8001/ready
