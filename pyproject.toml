[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pradysagican"
version = "6.0.0"
description = "PRADYSAGICAN — The World's First Super General Intelligence System. 40 subsystems, 21K+ lines, 11.3M features."
readme = "README.md"
license = {text = "Proprietary — See LICENSE"}
requires-python = ">=3.11"
authors = [{name = "Prady", email = "f20240323@dubai.bits-pilani.ac.in"}]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "rich>=13.9.0",
    "numpy>=1.26.0",
    "networkx>=3.3",
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
full = [
    "scikit-learn>=1.5.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "tiktoken>=0.7.0",
    "apscheduler>=3.10.0",
    "aiofiles>=24.1.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "jinja2>=3.1.0",
    "websockets>=13.0",
]

dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
pradysagican = "pradysagican.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
