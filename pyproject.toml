[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pradysagican"
version = "6.0.0"
description = "PRADYSAGICAN — The World's First Super General Intelligence System. 55 subsystems, 39K+ lines, 75-90+ features."
readme = "README.md"
license = {text = "Proprietary — See LICENSE"}
requires-python = ">=3.11"
authors = [{name = "Prady", email = "f20240323@dubai.bits-pilani.ac.in"}]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "rich>=13.9.0",
    "numpy>=1.26.0",
    "networkx>=3.3",
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
full = [
    "scikit-learn>=1.5.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "tiktoken>=0.7.0",
    "apscheduler>=3.10.0",
    "aiofiles>=24.1.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "jinja2>=3.1.0",
    "websockets>=13.0",
]

dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

# Phased upgrade bundles (non-breaking by default; install explicitly)
upgrade_phase1 = [
    "e2b-code-interpreter>=0.0.14",
    "e2b>=0.17.0",
    "crawl4ai>=0.3.0",
    "litellm>=1.40.0",
    "apscheduler>=3.10.0",
]

upgrade_phase2 = [
    "mem0ai>=0.1.0",
    "pydantic-ai>=0.0.14",
    "ell-ai>=0.0.12",
    "mcp>=1.0.0",
    "qdrant-client>=1.9.0",
    "rank-bm25>=0.2.2",
]

upgrade_phase3 = [
    "scrapling>=0.2.0",
    "python-telegram-bot>=21.0",
    "exa-py>=1.0.0",
    "firecrawl-py>=0.0.12",
    "serpapi>=0.1.5",
]

upgrade_optional_runtime = [
    "vllm>=0.5.0",
    "mlx-lm>=0.15.0",
    "sglang>=0.3.0",
]

upgrade_optional_ml = [
    "peft>=0.11.0",
    "transformers>=4.41.0",
    "accelerate>=0.30.0",
    "torch>=2.3.0",
]

upgrade_observability = [
    "langfuse>=2.0.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
]

upgrade_retrieval = [
    "qdrant-client>=1.9.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "rerankers>=0.5.0",
    "graphrag>=0.3.0",
    "neo4j>=5.19.0",
]

upgrade_web_agent = [
    "browser-use>=0.1.0",
    "mcp>=1.0.0",
    "crawl4ai>=0.3.0",
    "scrapling>=0.2.0",
]

upgrade_compendium = [
    "e2b-code-interpreter>=0.0.14",
    "e2b>=0.17.0",
    "crawl4ai>=0.3.0",
    "scrapling>=0.2.0",
    "mem0ai>=0.1.0",
    "litellm>=1.40.0",
    "qdrant-client>=1.9.0",
    "browser-use>=0.1.0",
    "peft>=0.11.0",
    "transformers>=4.41.0",
    "accelerate>=0.30.0",
    "torch>=2.3.0",
    "smolagents>=1.0.0",
    "pydantic-ai>=0.0.14",
    "ell-ai>=0.0.12",
    "langfuse>=2.0.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "exa-py>=1.0.0",
    "firecrawl-py>=0.0.12",
    "serpapi>=0.1.5",
    "python-telegram-bot>=21.0",
    "discord.py>=2.3.0",
    "vllm>=0.5.0",
    "mlx-lm>=0.15.0",
    "sglang>=0.3.0",
    "apscheduler>=3.10.0",
    "mcp>=1.0.0",
    "graphrag>=0.3.0",
    "neo4j>=5.19.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "rerankers>=0.5.0",
]

upgrade_omega_theory = [
    "pymdp>=0.0.7",
    "pyphi>=1.2.0",
    "dreamer-pytorch>=2.0.0",
    "gymnasium>=0.29.0",
    "dowhy>=0.11.0",
    "causalinference>=0.1.3",
    "torchhd>=0.4.0",
    "playwright>=1.44.0",
]

[project.scripts]
pradysagican = "pradysagican.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["pradysagican*"]
